name: Maven Package

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          server-id: github
          settings-path: ${{ github.workspace }}
          cache: maven

      - name: Set Maven version for non-main branches
        if: github.event_name == 'push' && github.ref_name != 'main'
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          BASE_VERSION=${VERSION%-SNAPSHOT}

          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9.-]#-#g' \
            | sed 's/-\{2,\}/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//')

          SHORT_SHA=$(git rev-parse --short HEAD)

          NEW_VERSION="${BASE_VERSION}-${SAFE_BRANCH}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"

          echo "Using Maven version: ${NEW_VERSION}"

          mvn versions:set \
            -DnewVersion="${NEW_VERSION}" \
            -DgenerateBackupPoms=false

      - name: Build
        run: mvn -B -Pserver package

      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        run: mvn -B -Pserver deploy -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}